pause_blocking:
  fields:
    minutes:
      required: true
      default: 15
      selector:
        number:
          min: 5
          max: 60
          step: 5
          unit_of_measurement: min
          mode: slider
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: technitium_dash

resume_blocking:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: technitium_dash
